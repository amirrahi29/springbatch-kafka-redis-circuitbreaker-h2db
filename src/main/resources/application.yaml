spring:
  application:
    name: Producer-App
  aop:
    proxy-target-class: true

  kafka:
    bootstrap-servers: localhost:9092
    template:
      default-topic: amir-topic
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        linger.ms: 10

  datasource:
    url: jdbc:h2:mem:producerdb
    driver-class-name: org.h2.Driver
    username: amir
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

server:
  port: 8080

batch:
  chunk-size: 500
  chunk-retry-limit: 2
  dlq-topic: amir-dlq-topic

resilience4j:
  retry:
    instances:
      s3Read:
        maxAttempts: 3
        waitDuration: 200ms
  circuitbreaker:
    instances:
      fetchProducts:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state: 10s

s3:
  bucket: batch-kafka-demo
  region: us-east-1
  accessKey: ${AWS_ACCESS_KEY_ID}
  secretKey: ${AWS_SECRET_ACCESS_KEY}
