# Install under $SPLUNK_HOME/etc/apps/patient-dlq/local/savedsearches.conf
# Sends the morning mail at 08:00 Asia/Kolkata.
# Normal publishes stay on amir-topic. This search reads only amir-dlq-topic events.

[Patient DLQ morning email]
cron_schedule = 0 8 * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.time_zone = Asia/Kolkata
enableSched = 1
search = index=* "DLQ event" "amir-dlq-topic" | rex field=_raw "type=(?<eventType>\S+) topic=(?<topic>\S+) fileName=(?<fileName>\S+) dlqRows=(?<dlqRows>\d+) referenceId=(?<referenceId>\S+) chunkId=(?<chunkId>\S+) failedAt=(?<failedAt>\S+) byteOffset=(?<byteOffset>\S+) retryCount=(?<retryCount>\d+) reason=\"(?<reason>[^\"]*)\"" | table failedAt, fileName, dlqRows, referenceId, chunkId, byteOffset, retryCount, reason, eventType
action.email = 1
action.email.to = amirrahi29@gmail.com
action.email.subject = Patient DLQ morning report
action.email.sendresults = 1
action.email.include.results_link = 1
action.email.message.alert = Patient DLQ failures from amir-dlq-topic. Columns are failure time, file name, DLQ row count, reference ID, failed chunk, byte offset, retry count, and the error reason.
